        const DEFAULT_PINS = ["WOS-Collection", "우송대학교 WOS-AI캠퍼스 플랫폼", "비즈니스모델과경영의사결정론 - 중간고사 연습사이트", "AI경영학과 교수진 활동 DB", "우송대 비상연락망", "비즈니스모델과의사결정론 -강의플랫폼", "AI경영학과 로봇도우미", "엔디컷 주간업무보고 시스템", "New 데일리묵상캘린더", "엔디컷단대 2026 학사 캘린더"];

            if (p.category && CAT[p.category]) return [p.category, p.sub || CAT[p.category].subs[0]];
            return TITLE_MAP[(p.title || '').trim()] || ['etc', '미분류'];
        };
        const typeOf = (link = '') => {
            if (/instagram\.com|facebook\.com|youtube\.com|youtu\.be|x\.com|twitter\.com|canva\.link|tiktok\.com/.test(link)) return 'video';
            if (/docs\.google\.com|drive\.google\.com/.test(link)) return 'doc';
            return 'app';
        };
        const TYPES = { all: '전체 유형', app: '🌐 웹앱', video: '🎬 영상', doc: '📄 문서' };

        // 초성 검색
        const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
        const toCho = (s) => [...s].map(ch => { const k = ch.charCodeAt(0) - 44032; return (k >= 0 && k < 11172) ? CHO[Math.floor(k / 588)] : ch; }).join('');
        const isCho = (q) => /^[ㄱ-ㅎ\s]+$/.test(q);

        const loadLS = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
        const saveLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

        const App = () => {
            const [projects, setProjects] = useState(DEMO_PROJECTS);
            const [copiedId, setCopiedId] = useState(null);

            // 탐색 상태
            const [q, setQ] = useState("");
            const [cat, setCat] = useState("all");      // all | fav | recent | 분류id
            const [sub, setSub] = useState("all");
            const [type, setType] = useState("all");
            const [view, setView] = useState(loadLS('pf_view', 'grid'));
            const [favs, setFavs] = useState(loadLS('pf_favs', DEFAULT_PINS));
            const [recent, setRecent] = useState(loadLS('pf_recent', []));
            const [sheetOpen, setSheetOpen] = useState(false);
            const searchRef = useRef(null);
            
            // Admin State
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [password, setPassword] = useState("");
            const [adminTab, setAdminTab] = useState("list"); 
            
            // Edit/Create State
            const [editTarget, setEditTarget] = useState(null);
            const [formData, setFormData] = useState({ title: "", desc: "", icon: "", color: "bg-gray-100 text-gray-600", link: "", category: "", sub: "" });
            
            const [uploadStatus, setUploadStatus] = useState("");
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (db) {
                    const unsubscribe = db.collection("portfolio").orderBy("id", "desc").onSnapshot((snapshot) => {
                        const dbProjects = snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id }));
                        if(snapshot.size > 0 || dbProjects.length === 0) {
                             setProjects(dbProjects);
                        }
                    });
                    return () => unsubscribe();
                }
            }, []);

            // "/" 키로 검색창 포커스
            useEffect(() => {
                const h = (e) => {
                    const tag = document.activeElement && document.activeElement.tagName;
                    if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') { e.preventDefault(); searchRef.current && searchRef.current.focus(); }
                };
                window.addEventListener('keydown', h);
                return () => window.removeEventListener('keydown', h);
            }, []);

            useEffect(() => saveLS('pf_favs', favs), [favs]);
            useEffect(() => saveLS('pf_recent', recent), [recent]);
            useEffect(() => saveLS('pf_view', view), [view]);

            // 분류·검색용 필드를 붙인 목록
            const items = React.useMemo(() => projects.map(p => {
                const [c, s] = classify(p);
                const key = (p.title || '').trim() + '|' + (p.link || '');
                return { ...p, _c: c, _s: s, _t: typeOf(p.link), _key: key,
                    _hay: ((p.title || '') + ' ' + (p.desc || '') + ' ' + s + ' ' + CAT[c].name).toLowerCase(),
                    _cho: toCho((p.title || '') + ' ' + (p.desc || '')).replace(/\s/g, '') };
            }), [projects]);

            const isFav = (it) => favs.includes(it._key) || favs.includes((it.title || '').trim());
            const toggleFav = (it) => {
                const t = (it.title || '').trim();
                setFavs(isFav(it) ? favs.filter(f => f !== it._key && f !== t) : [...favs, it._key]);
            };
            const matchQ = (it) => {
                const s = q.trim().toLowerCase();
                if (!s) return true;
                if (isCho(s)) return it._cho.includes(s.replace(/\s/g, ''));
                return s.split(/\s+/).every(w => it._hay.includes(w));
            };
            const openItem = (it) => {
                setRecent([it._key, ...recent.filter(r => r !== it._key)].slice(0, 15));
                window.open(it.link, '_blank', 'noopener');
            };
            const copyToClipboard = (link, id) => {
                const fullUrl = new URL(link, window.location.href).href;
                navigator.clipboard.writeText(fullUrl).then(() => {
                    setCopiedId(id);
                    setTimeout(() => setCopiedId(null), 2000);
                });
            };

            const checkPassword = () => {
                if (password === "1230") {
                    setIsAdmin(true);
                    setPassword("");
                } else {
                    alert("비밀번호가 틀렸습니다!");
                }
            };

            const handleDelete = async (docId) => {
                if (!db) return alert("데모 모드에서는 삭제할 수 없습니다.");
                if (!confirm(`정말 삭제하시겠습니까?`)) return;
                try {
                    await db.collection("portfolio").doc(docId).delete();
                    alert("삭제되었습니다.");
                } catch (e) {
                    alert("삭제 실패: " + e.message);
                }
            };

            const handleFormSubmit = async () => {
                if (!db) return alert("데모 모드입니다.");
                if (!formData.title || !formData.link) return alert("제목과 링크는 필수입니다.");

                try {
                    if (editTarget) {
                        await db.collection("portfolio").doc(editTarget.docId).update(formData);
                        alert("수정되었습니다.");
                    } else {
                        await db.collection("portfolio").add({
                            ...formData,
                            id: Date.now()
                        });
                        alert("추가되었습니다.");
                    }
                    setFormData({ title: "", desc: "", icon: "", color: "bg-gray-100 text-gray-600", link: "", category: "", sub: "" });
                    setEditTarget(null);
                    setAdminTab("list");
                } catch (e) {
                    alert("저장 실패: " + e.message);
                }
            };

            const startEdit = (project) => {
                setEditTarget(project);
                setFormData({
                    title: project.title,
                    desc: project.desc,
                    icon: project.icon,
                    color: project.color,
                    link: project.link,
                    category: project.category || classify(project)[0],
                    sub: project.sub || classify(project)[1]
                });
                setAdminTab("form");
            };

            const startCreate = () => {
                setEditTarget(null);
                setFormData({ title: "", desc: "", icon: "✨", color: "bg-blue-100 text-blue-600", link: "", category: "", sub: "" });
                setAdminTab("form");
            };

            const parseCSV = (text) => {
                const arr = []; 
                let quote = false; 
                let row = 0, col = 0, c = 0;
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                for (; c < text.length; c++) {
                    let cc = text[c], nc = text[c+1];
                    arr[row] = arr[row] || []; 
                    arr[row][col] = arr[row][col] || ''; 
                    if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; }
                    else if (cc == '"') { quote = !quote; }
                    else if (cc == ',' && !quote) { ++col; }
                    else if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; }
                    else if (cc == '\n' && !quote) { ++row; col = 0; }
                    else { arr[row][col] += cc; }
                }
                return arr;
            };

            const handleCsvUpload = (e) => {
                const file = e.target.files[0];
                if (!file || !db) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const text = event.target.result;
                    const rows = parseCSV(text);
                    const dataRows = rows.slice(1);
                    setUploadStatus("업로드 중...");
                    const batch = db.batch();
                    let count = 0;
                    dataRows.forEach((cols, index) => {
                        if (cols.length < 2 || !cols[0].trim()) return;
                        const newDocRef = db.collection("portfolio").doc();
                        batch.set(newDocRef, {
                            id: Date.now() + index,
                            title: cols[0].trim(), desc: cols[1].trim(), icon: cols[2] ? cols[2].trim() : '📁', 
                            color: cols[3] ? cols[3].trim() : "bg-gray-100 text-gray-600", link: cols[4] ? cols[4].trim() : "#",
                            category: cols[5] ? cols[5].trim() : "", sub: cols[6] ? cols[6].trim() : ""
                        });
                        count++;
                    });
                    if (count > 0) {
                        await batch.commit();
                        setUploadStatus(`${count}개 업로드 완료!`);
                        if(fileInputRef.current) fileInputRef.current.value = "";
                        setTimeout(() => setUploadStatus(""), 2000);
                        setAdminTab("list");
                    } else {
                        setUploadStatus("데이터 오류");
                    }
                };
                reader.readAsText(file);
            };

            const countOf = (c) => items.filter(i => i._c === c).length;
            const usedCats = CATS.filter(c => countOf(c.id) > 0);
            const favItems = items.filter(isFav);
            const recentItems = recent.map(k => items.find(i => i._key === k)).filter(Boolean);

            let list;
            if (cat === 'fav') list = favItems.filter(matchQ);
            else if (cat === 'recent') list = recentItems.filter(matchQ);
            else list = items.filter(i => (cat === 'all' || i._c === cat) && (sub === 'all' || i._s === sub) && (type === 'all' || i._t === type) && matchQ(i));

            const selectCat = (c) => { setCat(c); setSub('all'); setSheetOpen(false); window.scrollTo({ top: 0 }); };
            const onSearch = (v) => { setQ(v); if (cat === 'fav' || cat === 'recent') setCat('all'); };

            const hl = (text) => {
                const s = q.trim();
                if (!text || !s || isCho(s)) return text;
                const i = text.toLowerCase().indexOf(s.toLowerCase());
                if (i < 0) return text;
                return <>{text.slice(0, i)}<mark className="bg-yellow-200 rounded px-0.5">{text.slice(i, i + s.length)}</mark>{text.slice(i + s.length)}</>;
            };

            const TypeBadge = ({ t }) => t === 'app' ? null :
                <span className={`text-[10px] px-1.5 py-0.5 rounded-full shrink-0 ${t === 'video' ? 'bg-rose-50 text-rose-600' : 'bg-green-50 text-green-700'}`}>{t === 'video' ? '영상' : '문서'}</span>;

            const Row = ({ it, compact }) => (
                <div onClick={() => openItem(it)}
                    className={`flex items-center gap-3 bg-white cursor-pointer transition ${compact ? 'px-3 py-2.5 border-b border-gray-100 last:border-b-0 active:bg-gray-50' : 'p-2.5 rounded-xl border border-gray-200 hover:border-indigo-300 hover:shadow-md hover:-translate-y-0.5'}`}>
                    <div className={`w-9 h-9 rounded-lg flex items-center justify-center text-lg shrink-0 ${CAT[it._c].bg}`}>{it.icon && it.icon !== '✨' && it.icon !== '📁' ? it.icon : CAT[it._c].icon}</div>
                    <div className="min-w-0 flex-1">
                        <div className="text-[13px] font-bold text-gray-800 truncate">{hl(it.title)}</div>
                        <div className="text-[11px] text-gray-500 truncate">{hl(it.desc && it.desc.trim() !== (it.title || '').trim() ? it.desc : it._s)}</div>
                    </div>
                    <TypeBadge t={it._t} />
                    <button onClick={(e) => { e.stopPropagation(); copyToClipboard(it.link, it._key); }} title="링크 복사"
                        className={`hidden lg:flex w-7 h-7 rounded-md items-center justify-center text-sm shrink-0 ${copiedId === it._key ? 'text-green-600' : 'text-gray-300 hover:text-gray-600'}`}>
                        <i className={`ph-bold ${copiedId === it._key ? 'ph-check' : 'ph-link'}`}></i>
                    </button>
                    <button onClick={(e) => { e.stopPropagation(); toggleFav(it); }} title="즐겨찾기"
                        className={`text-lg px-1 shrink-0 ${isFav(it) ? 'text-yellow-400' : 'text-gray-300 hover:text-gray-400'}`}>★</button>
                </div>
            );

            const Grid = ({ arr }) => view === 'list'
                ? <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">{arr.map(it => <Row key={it._key + it.id} it={it} compact />)}</div>
                : <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2.5">{arr.map(it => <Row key={it._key + it.id} it={it} />)}</div>;

            const groupBy = (arr, k) => { const m = new Map(); arr.forEach(x => { if (!m.has(x[k])) m.set(x[k], []); m.get(x[k]).push(x); }); return [...m]; };
            const Empty = ({ msg }) => <div className="text-center text-gray-400 text-sm py-12">{msg || '검색 결과가 없습니다 🙂'}</div>;

            // ---------- 데스크톱 결과 ----------
            const DesktopResults = () => {
                if (!list.length) return <Empty msg={cat === 'fav' ? '⭐를 눌러 즐겨찾기를 추가하세요' : cat === 'recent' ? '아직 연 사이트가 없어요' : null} />;
                if (cat === 'fav' || cat === 'recent') return <Grid arr={list} />;
                if (cat === 'all') return groupBy(list, '_c').sort((a, b) => CATS.findIndex(c => c.id === a[0]) - CATS.findIndex(c => c.id === b[0])).map(([c, arr]) => (
                    <section key={c} className="mt-6">
                        <h2 className="text-[15px] font-bold mb-2.5 flex items-center gap-2">{CAT[c].icon} {CAT[c].name} <span className="text-xs font-normal text-gray-400">{arr.length}</span></h2>
                        <Grid arr={arr} />
                    </section>));
                return groupBy(list, '_s').map(([s, arr]) => (
                    <section key={s} className="mt-5">
                        <div className="text-xs font-bold text-gray-500 mb-2">{s} · {arr.length}</div>
                        <Grid arr={arr} />
                    </section>));
            };

            // ---------- 모바일 결과 ----------
            const MobileResults = () => {
                const Box = ({ children }) => <div className="bg-white rounded-2xl border border-gray-200 overflow-hidden">{children}</div>;
                if (cat === 'fav' || cat === 'recent') return list.length
                    ? <Box>{list.map(it => <Row key={it._key + it.id} it={it} compact />)}</Box>
                    : <Empty msg={cat === 'fav' ? '⭐를 눌러 즐겨찾기를 추가하세요' : '아직 연 사이트가 없어요'} />;
                if (q.trim()) return <>
                    <div className="text-sm font-bold mb-2">검색 결과 {list.length}</div>
                    {list.length ? <Box>{list.map(it => <Row key={it._key + it.id} it={it} compact />)}</Box> : <Empty />}
                </>;
                if (cat !== 'all') return groupBy(list, '_s').map(([s, arr]) => (
                    <section key={s} className="mb-4">
                        <h3 className="text-sm font-bold mb-2">{s} <span className="text-xs text-gray-400 font-normal">{arr.length}</span></h3>
                        <Box>{arr.map(it => <Row key={it._key + it.id} it={it} compact />)}</Box>
                    </section>));
                return <>
                    {favItems.length > 0 && <section className="mb-5">
                        <h3 className="text-sm font-bold mb-2">⭐ 자주 쓰는</h3>
                        <div className="grid grid-cols-4 gap-2">
                            {favItems.slice(0, 8).map(it => (
                                <div key={it._key + it.id} onClick={() => openItem(it)} className="bg-white border border-gray-200 rounded-2xl px-1 py-2.5 text-center cursor-pointer active:bg-gray-50">
                                    <div className={`w-9 h-9 mx-auto mb-1.5 rounded-lg flex items-center justify-center text-lg ${CAT[it._c].bg}`}>{CAT[it._c].icon}</div>
                                    <div className="text-[10.5px] leading-tight h-7 overflow-hidden break-keep">{it.title}</div>
                                </div>))}
                        </div>
                    </section>}
                    {usedCats.map(c => {
                        const arr = items.filter(i => i._c === c.id && (type === 'all' || i._t === type));
                        if (!arr.length) return null;
                        return <section key={c.id} className="mb-5">
                            <h3 className="text-sm font-bold mb-2 flex items-center gap-1.5">{c.icon} {c.name}
                                <span className="text-[10px] bg-gray-100 text-gray-500 rounded-full px-1.5">{arr.length}</span>
                                <button onClick={() => selectCat(c.id)} className="ml-auto text-xs text-indigo-600 font-normal">더보기 ›</button></h3>
                            <Box>{arr.slice(0, 4).map(it => <Row key={it._key + it.id} it={it} compact />)}</Box>
                        </section>;
                    })}
                </>;
            };

            const subs = (cat !== 'all' && CAT[cat]) ? [...new Set(items.filter(i => i._c === cat).map(i => i._s))] : [];
            const chip = (on) => `shrink-0 px-3 py-1.5 rounded-full text-[12.5px] border transition ${on ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400'}`;
            const navBtn = (on) => `w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13.5px] text-left transition ${on ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-gray-700 hover:bg-gray-100'}`;

            return (
                <div className="min-h-screen pb-24 lg:pb-10">
                    {/* ===== 데스크톱 (lg 이상): 좌측 사이드바 + 본문 ===== */}
                    <div className="hidden lg:grid grid-cols-[250px_1fr] min-h-screen">
                        <aside className="bg-white border-r border-gray-200 sticky top-0 h-screen overflow-y-auto p-4">
                            <div className="flex items-center gap-3 mb-5 px-1">
                                <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Professor&clothing=blazerAndShirt&glasses=round" alt="Profile" className="w-11 h-11 rounded-full bg-gray-100" />
                                <div>
                                    <div className="font-jua text-[15px] leading-tight">김형태의 코딩 포트폴리오</div>
                                    <div className="text-[11px] text-gray-500">우송대 AI경영학과 학과장</div>
                                </div>
                            </div>
                            <div className="text-[11px] text-gray-400 px-3 mb-1">바로가기</div>
                            <button className={navBtn(cat === 'fav')} onClick={() => selectCat('fav')}>⭐ 즐겨찾기<span className="ml-auto text-xs text-gray-400">{favItems.length}</span></button>
                            <button className={navBtn(cat === 'recent')} onClick={() => selectCat('recent')}>🕘 최근 연 사이트<span className="ml-auto text-xs text-gray-400">{recentItems.length}</span></button>
                            <div className="text-[11px] text-gray-400 px-3 mt-4 mb-1">분류</div>
                            <button className={navBtn(cat === 'all')} onClick={() => selectCat('all')}>🏠 전체<span className="ml-auto text-xs text-gray-400">{items.length}</span></button>
                            {usedCats.map(c => (
                                <button key={c.id} className={navBtn(cat === c.id)} onClick={() => selectCat(c.id)}>{c.icon} {c.name}<span className="ml-auto text-xs text-gray-400">{countOf(c.id)}</span></button>
                            ))}
                            <p className="text-[10.5px] text-gray-400 px-3 mt-6 leading-relaxed">AI (Claude, ChatGPT, 제미나이) 도우미들과 함께 만든 웹 애플리케이션 컬렉션입니다.</p>
                        </aside>
                        <main className="p-6 xl:p-8 min-w-0">
                            <div className="flex items-center gap-3 bg-white border border-gray-200 rounded-xl px-4 py-3 shadow-sm sticky top-4 z-10">
                                <i className="ph-bold ph-magnifying-glass text-gray-400"></i>
                                <input ref={searchRef} value={q} onChange={e => onSearch(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter' && list[0]) openItem(list[0]); if (e.key === 'Escape') onSearch(''); }}
                                    className="flex-1 outline-none text-[15px]" placeholder="사이트 이름·설명·학생 이름으로 검색 (초성 OK: ㅂㅅㅇㄹㅁ)" />
                                {q && <button onClick={() => onSearch('')} className="text-gray-400 text-sm">✕</button>}
                                <span className="text-[11px] border border-gray-200 rounded px-1.5 text-gray-400">/</span>
                            </div>
                            <div className="flex flex-wrap gap-2 items-center mt-4">
                                {subs.length > 1 && ['all', ...subs].map(s => <button key={s} className={chip(sub === s)} onClick={() => setSub(s)}>{s === 'all' ? '전체' : s}</button>)}
                                <span className="ml-auto"></span>
                                {Object.entries(TYPES).map(([k, v]) => <button key={k} className={chip(type === k)} onClick={() => setType(k)}>{v}</button>)}
                                <button className={chip(false)} onClick={() => setView(view === 'grid' ? 'list' : 'grid')}>{view === 'grid' ? '☰ 리스트' : '▦ 그리드'}</button>
                            </div>
                            {cat === 'all' && !q && favItems.length > 0 && (
                                <div className="mt-5">
                                    <div className="text-xs font-bold text-gray-500 mb-2">⭐ 자주 쓰는 사이트</div>
                                    <div className="flex gap-2 overflow-x-auto pb-1">
                                        {favItems.map(it => (
                                            <button key={it._key + it.id} onClick={() => openItem(it)} className="shrink-0 flex items-center gap-2 bg-white border border-gray-200 rounded-xl pl-1.5 pr-3 py-1.5 text-[12.5px] max-w-[230px] hover:border-indigo-300">
                                                <span className={`w-7 h-7 rounded-md flex items-center justify-center ${CAT[it._c].bg}`}>{CAT[it._c].icon}</span>
                                                <span className="truncate">{it.title}</span>
                                            </button>))}
                                    </div>
                                </div>)}
                            {(cat === 'fav' || cat === 'recent') && <h2 className="text-[15px] font-bold mt-6 mb-2.5">{cat === 'fav' ? '⭐ 즐겨찾기' : '🕘 최근 연 사이트'}</h2>}
                            {cat !== 'all' && CAT[cat] && <h2 className="text-lg font-bold mt-6">{CAT[cat].icon} {CAT[cat].name} <span className="text-sm font-normal text-gray-400">{list.length}</span></h2>}
                            <DesktopResults />
                            <footer className="text-center mt-12 text-gray-400 text-xs">&copy; 2024 Kim Hyung Tae Portfolio. All rights reserved.</footer>
                        </main>
                    </div>

                    {/* ===== 모바일·태블릿 (lg 미만): 상단 검색 + 분류 칩 + 하단 탭바 ===== */}
                    <div className="lg:hidden">
                        <header className="sticky top-0 z-30 bg-white border-b border-gray-200 px-4 pt-4 pb-2">
                            <div className="flex items-center gap-2.5 mb-3">
                                <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Professor&clothing=blazerAndShirt&glasses=round" alt="" className="w-9 h-9 rounded-full bg-gray-100" />
                                <div>
                                    <div className="font-jua text-[18px] leading-tight">김형태의 코딩 포트폴리오</div>
                                    <div className="text-[11px] text-gray-500">우송대 AI경영학과 · {items.length}개 사이트</div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 bg-gray-100 rounded-xl px-3 py-2.5">
                                <i className="ph-bold ph-magnifying-glass text-gray-400"></i>
                                <input value={q} onChange={e => onSearch(e.target.value)} className="flex-1 bg-transparent outline-none text-[15px] min-w-0" placeholder="사이트 검색 (초성 가능)" />
                                {q && <button onClick={() => onSearch('')} className="text-gray-400">✕</button>}
                            </div>
                            <div className="flex gap-1.5 overflow-x-auto pt-2.5 pb-1" style={{ scrollbarWidth: 'none' }}>
                                <button className={chip(cat === 'all')} onClick={() => selectCat('all')}>🏠 전체</button>
                                {usedCats.map(c => <button key={c.id} className={chip(cat === c.id)} onClick={() => selectCat(c.id)}>{c.icon} {c.name}</button>)}
                            </div>
                            {subs.length > 1 && (
                                <div className="flex gap-1.5 overflow-x-auto pt-1.5 pb-1" style={{ scrollbarWidth: 'none' }}>
                                    {['all', ...subs].map(s => <button key={s} className={`shrink-0 px-2.5 py-1 rounded-full text-[11.5px] ${sub === s ? 'bg-indigo-100 text-indigo-700 font-bold' : 'bg-gray-50 text-gray-500'}`} onClick={() => setSub(s)}>{s === 'all' ? '전체' : s}</button>)}
                                </div>)}
                        </header>
                        <main className="px-3.5 pt-4">
                            {cat !== 'all' && CAT[cat] && !q && <h2 className="text-base font-bold mb-3">{CAT[cat].icon} {CAT[cat].name} <span className="text-xs font-normal text-gray-400">{list.length}</span></h2>}
                            {(cat === 'fav' || cat === 'recent') && <h2 className="text-base font-bold mb-3">{cat === 'fav' ? '⭐ 즐겨찾기' : '🕘 최근 연 사이트'}</h2>}
                            <MobileResults />
                            <footer className="text-center mt-8 text-gray-400 text-[11px]">&copy; 2024 Kim Hyung Tae Portfolio.</footer>
                        </main>

                        {/* 하단 탭바 */}
                        <nav className="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-gray-200 grid grid-cols-4 pt-1.5" style={{ paddingBottom: 'max(10px, env(safe-area-inset-bottom))' }}>
                            {[['all', 'ph-house', '홈'], ['cat', 'ph-squares-four', '분류'], ['fav', 'ph-star', '즐겨찾기'], ['recent', 'ph-clock-counter-clockwise', '최근']].map(([k, ic, label]) => {
                                const on = k === 'cat' ? sheetOpen : (!sheetOpen && (k === 'all' ? !['fav', 'recent'].includes(cat) : cat === k));
                                return <button key={k} onClick={() => k === 'cat' ? setSheetOpen(true) : (onSearch(''), selectCat(k))}
                                    className={`flex flex-col items-center gap-0.5 text-[10.5px] ${on ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
                                    <i className={`ph${on ? '-fill' : ''} ${ic} text-[22px]`}></i>{label}</button>;
                            })}
                        </nav>

                        {/* 분류 바텀시트 */}
                        {sheetOpen && (
                            <div className="fixed inset-0 z-50 bg-black/40 flex items-end" onClick={() => setSheetOpen(false)}>
                                <div className="bg-white w-full rounded-t-3xl p-4 pb-8 max-h-[80vh] overflow-y-auto modal-content" onClick={e => e.stopPropagation()}>
                                    <div className="w-10 h-1.5 bg-gray-200 rounded-full mx-auto mb-3"></div>
                                    <div className="font-bold mb-3">분류로 찾기</div>
                                    <div className="grid grid-cols-2 gap-2.5">
                                        {usedCats.map(c => (
                                            <button key={c.id} onClick={() => { onSearch(''); selectCat(c.id); }} className="flex items-center gap-2.5 border border-gray-200 rounded-2xl p-3 text-left active:bg-gray-50">
                                                <span className={`w-9 h-9 rounded-lg flex items-center justify-center text-lg ${c.bg}`}>{c.icon}</span>
                                                <span><span className="block text-[13px] font-bold">{c.name}</span><span className="block text-[10.5px] text-gray-500">{countOf(c.id)}개 · {c.desc}</span></span>
                                            </button>))}
                                    </div>
                                    <div className="flex gap-1.5 mt-4 flex-wrap">
                                        {Object.entries(TYPES).map(([k, v]) => <button key={k} className={chip(type === k)} onClick={() => setType(k)}>{v}</button>)}
                                    </div>
                                </div>
                            </div>)}
                    </div>

                    <button 
                        onClick={() => setIsAdminOpen(true)}
                        className="admin-btn bg-white text-gray-400 hover:text-indigo-600 p-2 rounded-full shadow border border-gray-200 hover:border-indigo-500 transition-all opacity-70 hover:opacity-100 bottom-20 lg:bottom-5"
                    >
                        <i className="ph-fill ph-gear text-lg"></i>
                    </button>

                    {/* Admin Dashboard */}
                    {isAdminOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-xl w-full max-w-3xl max-h-[90vh] shadow-2xl overflow-hidden flex flex-col modal-content relative">
                                
                                <div className="bg-gray-900 text-white p-3 flex justify-between items-center shrink-0">
                                    <h2 className="text-base font-bold font-jua flex items-center">
                                        <i className="ph-fill ph-lock-key text-yellow-400 mr-2"></i>
                                        관리자 대시보드
                                    </h2>
                                    <button onClick={() => setIsAdminOpen(false)} className="text-gray-400 hover:text-white transition">
                                        <i className="ph-bold ph-x text-lg"></i>
                                    </button>
                                </div>

                                {!isAdmin ? (
                                    <div className="flex-1 flex flex-col items-center justify-center p-8">
                                        <div className="w-full max-w-xs space-y-3">
                                            <p className="text-center text-gray-600 font-bold text-sm">비밀번호를 입력하세요.</p>
                                            <input 
                                                type="password" 
                                                value={password}
                                                onChange={(e) => setPassword(e.target.value)}
                                                onKeyPress={(e) => e.key === 'Enter' && checkPassword()}
                                                className="w-full p-2 border-2 border-gray-200 rounded-lg text-center text-lg font-bold tracking-widest focus:border-indigo-500 focus:outline-none"
                                                placeholder="****"
                                                autoFocus
                                            />
                                            <button onClick={checkPassword} className="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition text-sm">
                                                접속하기
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-1 overflow-hidden">
                                        <div className="w-40 bg-gray-50 border-r border-gray-200 p-3 flex flex-col gap-1 shrink-0">
                                            <button onClick={() => setAdminTab("list")} className={`p-2 rounded-lg text-left font-bold text-xs flex items-center ${adminTab==='list' ? 'bg-indigo-100 text-indigo-700' : 'text-gray-600 hover:bg-gray-200'}`}>
                                                <i className="ph-bold ph-list-dashes mr-2"></i> 목록 관리
                                            </button>
                                            <button onClick={startCreate} className={`p-2 rounded-lg text-left font-bold text-xs flex items-center ${adminTab==='form' ? 'bg-indigo-100 text-indigo-700' : 'text-gray-600 hover:bg-gray-200'}`}>
                                                <i className="ph-bold ph-plus-circle mr-2"></i> 개별 추가
                                            </button>
                                            <button onClick={() => setAdminTab("csv")} className={`p-2 rounded-lg text-left font-bold text-xs flex items-center ${adminTab==='csv' ? 'bg-indigo-100 text-indigo-700' : 'text-gray-600 hover:bg-gray-200'}`}>
                                                <i className="ph-bold ph-file-csv mr-2"></i> 일괄 업로드
                                            </button>
                                            <div className="mt-auto">
                                                <button onClick={() => { setIsAdmin(false); setIsAdminOpen(false); }} className="w-full p-1.5 rounded border border-gray-300 text-gray-500 text-[10px] hover:bg-red-50 hover:text-red-500 hover:border-red-200 font-bold">
                                                    로그아웃
                                                </button>
                                            </div>
                                        </div>

                                        <div className="flex-1 p-4 overflow-y-auto bg-white">
                                            {adminTab === 'list' && (
                                                <div className="h-full flex flex-col">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <h3 className="font-bold text-sm">프로젝트 목록 ({projects.length})</h3>
                                                    </div>
                                                    {/* Scroll Fix: overflow-y-auto */}
                                                    <div className="border rounded-lg overflow-y-auto flex-1">
                                                        <table className="w-full text-xs text-left">
                                                            <thead className="bg-gray-100 text-gray-600 uppercase font-bold text-[10px]">
                                                                <tr>
                                                                    <th className="p-2 w-[85%]">제목 / 설명</th>
                                                                    <th className="p-2 w-[15%] text-center">관리</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-gray-100">
                                                                {projects.map(p => (
                                                                    <tr key={p.id} className="hover:bg-gray-50 group">
                                                                        <td className="p-2">
                                                                            <div className="flex items-start gap-2">
                                                                                <div className="flex-1 min-w-0">
                                                                                    <div className="flex items-center gap-2">
                                                                                        <span className="text-base">{p.icon}</span>
                                                                                        <span className="font-bold text-gray-800 text-xs">{p.title}</span>
                                                                                        <span className="text-[9px] bg-gray-100 text-gray-500 rounded px-1">{CAT[classify(p)[0]].name} · {classify(p)[1]}</span>
                                                                                    </div>
                                                                                    <div className="text-[10px] text-gray-500 truncate mt-0.5 pl-6">{p.desc}</div>
                                                                                    <a href={p.link} target="_blank" className="text-[10px] text-indigo-400 hover:underline pl-6 block">{p.link}</a>
                                                                                </div>
                                                                            </div>
                                                                        </td>
                                                                        <td className="p-2 text-center space-x-1 align-top pt-2">
                                                                            {p.docId ? (
                                                                                <>
                                                                                    <button onClick={() => startEdit(p)} className="text-gray-400 hover:text-indigo-600"><i className="ph-bold ph-pencil-simple text-sm"></i></button>
                                                                                    <button onClick={() => handleDelete(p.docId)} className="text-gray-400 hover:text-red-600"><i className="ph-bold ph-trash text-sm"></i></button>
                                                                                </>
                                                                            ) : (
                                                                                <span className="text-[9px] text-gray-300 bg-gray-100 px-1 rounded">Demo</span>
                                                                            )}
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}

                                            {adminTab === 'form' && (
                                                <div className="max-w-md mx-auto">
                                                    <h3 className="font-bold text-sm mb-4 border-b pb-1">
                                                        {editTarget ? "프로젝트 수정" : "새 프로젝트 추가"}
                                                    </h3>
                                                    <div className="space-y-3">
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-gray-500 mb-1">제목</label>
                                                            <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none" 
                                                                value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} placeholder="예: 급식표 앱" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-gray-500 mb-1">설명</label>
                                                            <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none" 
                                                                value={formData.desc} onChange={e => setFormData({...formData, desc: e.target.value})} placeholder="설명" />
                                                        </div>
                                                        <div className="flex gap-3">
                                                            <div className="flex-1">
                                                                <label className="block text-[10px] font-bold text-gray-500 mb-1">아이콘</label>
                                                                <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none text-center" 
                                                                    value={formData.icon} onChange={e => setFormData({...formData, icon: e.target.value})} placeholder="🍱" />
                                                            </div>
                                                            <div className="flex-[2]">
                                                                <label className="block text-[10px] font-bold text-gray-500 mb-1">색상 (Tailwind)</label>
                                                                <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none" 
                                                                    value={formData.color} onChange={e => setFormData({...formData, color: e.target.value})} placeholder="bg-blue-100 text-blue-600" />
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-3">
                                                            <div className="flex-1">
                                                                <label className="block text-[10px] font-bold text-gray-500 mb-1">분류 (대분류)</label>
                                                                <select className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
                                                                    value={formData.category || ''} onChange={e => setFormData({...formData, category: e.target.value, sub: e.target.value ? CAT[e.target.value].subs[0] : ''})}>
                                                                    <option value="">자동 / 미분류</option>
                                                                    {CATS.filter(c => c.id !== 'etc').map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
                                                                </select>
                                                            </div>
                                                            <div className="flex-1">
                                                                <label className="block text-[10px] font-bold text-gray-500 mb-1">세부분류</label>
                                                                <select className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-white" disabled={!formData.category}
                                                                    value={formData.sub || ''} onChange={e => setFormData({...formData, sub: e.target.value})}>
                                                                    {(CAT[formData.category] ? CAT[formData.category].subs : ['-']).map(s => <option key={s} value={s}>{s}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-gray-500 mb-1">링크</label>
                                                            <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none" 
                                                                value={formData.link} onChange={e => setFormData({...formData, link: e.target.value})} placeholder="./Lv4_S02_Lunch.html" />
                                                        </div>
                                                        <div className="pt-2 flex gap-2">
                                                            <button onClick={() => setAdminTab("list")} className="flex-1 bg-gray-200 text-gray-700 py-2 rounded text-xs font-bold hover:bg-gray-300">취소</button>
                                                            <button onClick={handleFormSubmit} className="flex-[2] bg-indigo-600 text-white py-2 rounded text-xs font-bold hover:bg-indigo-700 shadow">
                                                                {editTarget ? "수정 완료" : "추가하기"}
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {adminTab === 'csv' && (
                                                <div className="max-w-md mx-auto text-center pt-4">
                                                    <div className="bg-green-50 border-2 border-dashed border-green-300 rounded-lg p-6 mb-4">
                                                        <i className="ph-duotone ph-file-csv text-4xl text-green-500 mb-2"></i>
                                                        <h3 className="text-sm font-bold text-green-800 mb-1">CSV 일괄 업로드</h3>
                                                        <p className="text-[10px] text-gray-600 mb-4">
                                                            형식: 제목,설명,아이콘,색상,링크,분류ID(선택),세부분류(선택)<br/>분류ID: learn, ops, ai, stu, wis, biz, life
                                                        </p>
                                                        <input 
                                                            type="file" 
                                                            accept=".csv"
                                                            ref={fileInputRef}
                                                            onChange={handleCsvUpload}
                                                            className="block w-full text-[10px] text-gray-500
                                                                file:mr-2 file:py-1 file:px-3
                                                                file:rounded-full file:border-0
                                                                file:text-[10px] file:font-semibold
                                                                file:bg-green-100 file:text-green-700
                                                                hover:file:bg-green-200 cursor-pointer mx-auto max-w-xs
                                                            "
                                                        />
                                                    </div>
                                                    {uploadStatus && (
                                                        <div className="bg-indigo-50 text-indigo-700 p-2 rounded text-xs font-bold animate-pulse">
                                                            {uploadStatus}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
