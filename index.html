<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김형태님의 AI 코딩 포트폴리오</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.12.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .font-jua { font-family: 'Jua', sans-serif; }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 5px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; z-index: 50; }
        /* Modal Animation */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-content { animation: fadeIn 0.2s ease-out; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // [설정 구역] Firebase 설정
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBiMp5UEmNviSazPRxb-5L60jJnELZL6S0",
            authDomain: "ai-coding-collection.firebaseapp.com",
            projectId: "ai-coding-collection",
            storageBucket: "ai-coding-collection.firebasestorage.app",
            messagingSenderId: "572754851302",
            appId: "1:572754851302:web:22050169bb98eebaa3d227"
        };

        // Firebase 초기화
        let db = null;
        if (firebaseConfig.apiKey) {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        }

        // 기본 데모 데이터
        const DEMO_PROJECTS = [
            { id: 1, title: "모의투자 동아리 앱", desc: "React와 State를 활용해 만든 주식 매매 시뮬레이션", icon: "📈", color: "bg-purple-100 text-purple-600", link: "./Lv4_S01_Stock.html" },
            { id: 2, title: "우리 반 급식표", desc: "요일별 급식 메뉴를 확인하고 좋아요를 누르는 앱", icon: "🍱", color: "bg-orange-100 text-orange-600", link: "./Lv4_S02_Lunch.html" },
            { id: 3, title: "영원한 방명록", desc: "새로고침해도 사라지지 않는 로컬 스토리지 DB 실습", icon: "📝", color: "bg-yellow-100 text-yellow-600", link: "./Lv5_S01_Guestbook.html" },
            { id: 4, title: "AI 봇 채팅방", desc: "실시간으로 대화하는 듯한 채팅 UI 구현", icon: "💬", color: "bg-blue-100 text-blue-600", link: "./Lv5_S02_Chat.html" },
            { id: 5, title: "수료증 발급기", desc: "과정을 마치고 이름을 입력하면 상장이 나오는 앱", icon: "🎓", color: "bg-green-100 text-green-600", link: "./Lv6_S02_Graduation.html" }
        ];

        const App = () => {
            const [projects, setProjects] = useState(DEMO_PROJECTS);
            const [copiedId, setCopiedId] = useState(null);
            
            // Admin State
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [password, setPassword] = useState("");
            const [adminTab, setAdminTab] = useState("list"); 
            
            // Edit/Create State
            const [editTarget, setEditTarget] = useState(null);
            const [formData, setFormData] = useState({ title: "", desc: "", icon: "", color: "bg-gray-100 text-gray-600", link: "" });
            
            const [uploadStatus, setUploadStatus] = useState("");
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (db) {
                    const unsubscribe = db.collection("portfolio").orderBy("id", "desc").onSnapshot((snapshot) => {
                        const dbProjects = snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id }));
                        if(snapshot.size > 0 || dbProjects.length === 0) {
                             setProjects(dbProjects);
                        }
                    });
                    return () => unsubscribe();
                }
            }, []);

            const copyToClipboard = (link, id) => {
                const fullUrl = new URL(link, window.location.href).href;
                navigator.clipboard.writeText(fullUrl).then(() => {
                    setCopiedId(id);
                    setTimeout(() => setCopiedId(null), 2000);
                });
            };

            const checkPassword = () => {
                if (password === "1230") {
                    setIsAdmin(true);
                    setPassword("");
                } else {
                    alert("비밀번호가 틀렸습니다!");
                }
            };

            const handleDelete = async (docId) => {
                if (!db) return alert("데모 모드에서는 삭제할 수 없습니다.");
                if (!confirm(`정말 삭제하시겠습니까?`)) return;
                try {
                    await db.collection("portfolio").doc(docId).delete();
                    alert("삭제되었습니다.");
                } catch (e) {
                    alert("삭제 실패: " + e.message);
                }
            };

            const handleFormSubmit = async () => {
                if (!db) return alert("데모 모드입니다.");
                if (!formData.title || !formData.link) return alert("제목과 링크는 필수입니다.");

                try {
                    if (editTarget) {
                        await db.collection("portfolio").doc(editTarget.docId).update(formData);
                        alert("수정되었습니다.");
                    } else {
                        await db.collection("portfolio").add({
                            ...formData,
                            id: Date.now()
                        });
                        alert("추가되었습니다.");
                    }
                    setFormData({ title: "", desc: "", icon: "", color: "bg-gray-100 text-gray-600", link: "" });
                    setEditTarget(null);
                    setAdminTab("list");
                } catch (e) {
                    alert("저장 실패: " + e.message);
                }
            };

            const startEdit = (project) => {
                setEditTarget(project);
                setFormData({
                    title: project.title,
                    desc: project.desc,
                    icon: project.icon,
                    color: project.color,
                    link: project.link
                });
                setAdminTab("form");
            };

            const startCreate = () => {
                setEditTarget(null);
                setFormData({ title: "", desc: "", icon: "✨", color: "bg-blue-100 text-blue-600", link: "" });
                setAdminTab("form");
            };

            const parseCSV = (text) => {
                const arr = []; 
                let quote = false; 
                let row = 0, col = 0, c = 0;
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                for (; c < text.length; c++) {
                    let cc = text[c], nc = text[c+1];
                    arr[row] = arr[row] || []; 
                    arr[row][col] = arr[row][col] || ''; 
                    if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; }
                    else if (cc == '"') { quote = !quote; }
                    else if (cc == ',' && !quote) { ++col; }
                    else if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; }
                    else if (cc == '\n' && !quote) { ++row; col = 0; }
                    else { arr[row][col] += cc; }
                }
                return arr;
            };

            const handleCsvUpload = (e) => {
                const file = e.target.files[0];
                if (!file || !db) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const text = event.target.result;
                    const rows = parseCSV(text);
                    const dataRows = rows.slice(1);
                    setUploadStatus("업로드 중...");
                    const batch = db.batch();
                    let count = 0;
                    dataRows.forEach((cols, index) => {
                        if (cols.length < 2 || !cols[0].trim()) return;
                        const newDocRef = db.collection("portfolio").doc();
                        batch.set(newDocRef, {
                            id: Date.now() + index,
                            title: cols[0].trim(), desc: cols[1].trim(), icon: cols[2] ? cols[2].trim() : '📁', 
                            color: cols[3] ? cols[3].trim() : "bg-gray-100 text-gray-600", link: cols[4] ? cols[4].trim() : "#"
                        });
                        count++;
                    });
                    if (count > 0) {
                        await batch.commit();
                        setUploadStatus(`${count}개 업로드 완료!`);
                        if(fileInputRef.current) fileInputRef.current.value = "";
                        setTimeout(() => setUploadStatus(""), 2000);
                        setAdminTab("list");
                    } else {
                        setUploadStatus("데이터 오류");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <div className="bg-indigo-600 text-white pt-16 pb-20 px-4 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full opacity-10">
                            <i className="ph-fill ph-code text-9xl absolute -top-10 -left-10"></i>
                            <i className="ph-fill ph-brackets-curly text-9xl absolute bottom-0 right-0"></i>
                        </div>
                        <h1 className="text-3xl md:text-4xl font-bold font-jua mb-3 relative z-10">
                            김형태의 코딩 포트폴리오
                        </h1>
                        <p className="text-indigo-200 text-sm md:text-base max-w-2xl mx-auto relative z-10">
                            AI (Claude, ChatGPT, 제미나이) 도우미들과 함께 만든<br/>
                            재미있고 창의적인 웹 애플리케이션 컬렉션입니다.
                        </p>
                    </div>

                    <div className="max-w-6xl mx-auto px-4 -mt-12 relative z-20">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {/* Profile Card */}
                            <div className="bg-white rounded-xl shadow-lg p-5 flex flex-col items-center text-center border-t-4 border-indigo-500">
                                <div className="w-20 h-20 rounded-full overflow-hidden border-4 border-white shadow-md -mt-14 mb-3 bg-gray-200 shrink-0">
                                    <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Professor&clothing=blazerAndShirt&glasses=round" 
                                         alt="Profile" className="w-full h-full object-cover" />
                                </div>
                                <h2 className="text-lg font-bold text-gray-800 font-jua">김형태</h2>
                                <p className="text-xs text-gray-500 mb-3">우송대학교 AI경영학과 학과장</p>
                                <div className="flex gap-1 mb-3 justify-center flex-wrap">
                                    <span className="px-2 py-0.5 bg-gray-100 rounded-full text-[10px] font-bold text-gray-600">#React</span>
                                    <span className="px-2 py-0.5 bg-gray-100 rounded-full text-[10px] font-bold text-gray-600">#AI</span>
                                    <span className="px-2 py-0.5 bg-gray-100 rounded-full text-[10px] font-bold text-gray-600">#Edu</span>
                                </div>
                                <a href="mailto:contact@example.com" className="w-full py-1.5 border border-gray-300 rounded-lg text-xs font-bold text-gray-600 hover:bg-gray-50 transition">
                                    <i className="ph-bold ph-envelope-simple mr-1"></i> 연락하기
                                </a>
                            </div>

                            {/* Project Cards (폰트 축소 적용됨) */}
                            {projects.map((project) => (
                                <div key={project.id} className="bg-white rounded-xl shadow p-4 flex flex-col justify-between card-hover transition-all duration-300 relative group h-full">
                                    <div className="flex flex-col flex-1">
                                        {/* 가로형 헤더바: 폰트 text-xs */}
                                        <div className={`w-full p-2.5 rounded-lg flex items-center gap-2 mb-2 shrink-0 ${project.color || 'bg-gray-100'}`}>
                                            <div className="text-lg shrink-0">
                                                {project.icon || '📁'}
                                            </div>
                                            <h3 className="text-xs font-bold font-jua break-keep leading-tight">
                                                {project.title}
                                            </h3>
                                        </div>
                                        {/* 설명 폰트: text-[11px] */}
                                        <p className="text-gray-500 text-[11px] mb-3 leading-relaxed break-keep flex-1 px-1">
                                            {project.desc}
                                        </p>
                                    </div>
                                    
                                    <div className="flex gap-2 mt-auto shrink-0">
                                        <a href={project.link} target="_blank" className="flex-1 bg-gray-900 text-white py-1.5 rounded-lg font-bold text-[11px] hover:bg-gray-800 transition flex items-center justify-center gap-1">
                                            <i className="ph-bold ph-play-circle text-sm"></i> 실행
                                        </a>
                                        <button 
                                            onClick={() => copyToClipboard(project.link, project.id)}
                                            className={`w-8 h-8 rounded-lg flex items-center justify-center transition border ${copiedId === project.id ? 'bg-green-50 border-green-200 text-green-600' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}`}
                                            title="링크 복사"
                                        >
                                            {copiedId === project.id ? <i className="ph-bold ph-check text-sm"></i> : <i className="ph-bold ph-link text-sm"></i>}
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <footer className="text-center mt-10 text-gray-400 text-xs">
                        &copy; 2024 Kim Hyung Tae Portfolio. All rights reserved.
                    </footer>

                    <button 
                        onClick={() => setIsAdminOpen(true)}
                        className="admin-btn bg-white text-gray-400 hover:text-indigo-600 p-2 rounded-full shadow border border-gray-200 hover:border-indigo-500 transition-all opacity-70 hover:opacity-100"
                    >
                        <i className="ph-fill ph-gear text-lg"></i>
                    </button>

                    {/* Admin Dashboard */}
                    {isAdminOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-xl w-full max-w-3xl max-h-[90vh] shadow-2xl overflow-hidden flex flex-col modal-content relative">
                                
                                <div className="bg-gray-900 text-white p-3 flex justify-between items-center shrink-0">
                                    <h2 className="text-base font-bold font-jua flex items-center">
                                        <i className="ph-fill ph-lock-key text-yellow-400 mr-2"></i>
                                        관리자 대시보드
                                    </h2>
                                    <button onClick={() => setIsAdminOpen(false)} className="text-gray-400 hover:text-white transition">
                                        <i className="ph-bold ph-x text-lg"></i>
                                    </button>
                                </div>

                                {!isAdmin ? (
                                    <div className="flex-1 flex flex-col items-center justify-center p-8">
                                        <div className="w-full max-w-xs space-y-3">
                                            <p className="text-center text-gray-600 font-bold text-sm">비밀번호를 입력하세요.</p>
                                            <input 
                                                type="password" 
                                                value={password}
                                                onChange={(e) => setPassword(e.target.value)}
                                                onKeyPress={(e) => e.key === 'Enter' && checkPassword()}
                                                className="w-full p-2 border-2 border-gray-200 rounded-lg text-center text-lg font-bold tracking-widest focus:border-indigo-500 focus:outline-none"
                                                placeholder="****"
                                                autoFocus
                                            />
                                            <button onClick={checkPassword} className="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition text-sm">
                                                접속하기
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-1 overflow-hidden">
                                        <div className="w-40 bg-gray-50 border-r border-gray-200 p-3 flex flex-col gap-1 shrink-0">
                                            <button onClick={() => setAdminTab("list")} className={`p-2 rounded-lg text-left font-bold text-xs flex items-center ${adminTab==='list' ? 'bg-indigo-100 text-indigo-700' : 'text-gray-600 hover:bg-gray-200'}`}>
                                                <i className="ph-bold ph-list-dashes mr-2"></i> 목록 관리
                                            </button>
                                            <button onClick={startCreate} className={`p-2 rounded-lg text-left font-bold text-xs flex items-center ${adminTab==='form' ? 'bg-indigo-100 text-indigo-700' : 'text-gray-600 hover:bg-gray-200'}`}>
                                                <i className="ph-bold ph-plus-circle mr-2"></i> 개별 추가
                                            </button>
                                            <button onClick={() => setAdminTab("csv")} className={`p-2 rounded-lg text-left font-bold text-xs flex items-center ${adminTab==='csv' ? 'bg-indigo-100 text-indigo-700' : 'text-gray-600 hover:bg-gray-200'}`}>
                                                <i className="ph-bold ph-file-csv mr-2"></i> 일괄 업로드
                                            </button>
                                            <div className="mt-auto">
                                                <button onClick={() => { setIsAdmin(false); setIsAdminOpen(false); }} className="w-full p-1.5 rounded border border-gray-300 text-gray-500 text-[10px] hover:bg-red-50 hover:text-red-500 hover:border-red-200 font-bold">
                                                    로그아웃
                                                </button>
                                            </div>
                                        </div>

                                        <div className="flex-1 p-4 overflow-y-auto bg-white">
                                            {adminTab === 'list' && (
                                                <div className="h-full flex flex-col">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <h3 className="font-bold text-sm">프로젝트 목록 ({projects.length})</h3>
                                                    </div>
                                                    {/* Scroll Fix: overflow-y-auto */}
                                                    <div className="border rounded-lg overflow-y-auto flex-1">
                                                        <table className="w-full text-xs text-left">
                                                            <thead className="bg-gray-100 text-gray-600 uppercase font-bold text-[10px]">
                                                                <tr>
                                                                    <th className="p-2 w-[85%]">제목 / 설명</th>
                                                                    <th className="p-2 w-[15%] text-center">관리</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-gray-100">
                                                                {projects.map(p => (
                                                                    <tr key={p.id} className="hover:bg-gray-50 group">
                                                                        <td className="p-2">
                                                                            <div className="flex items-start gap-2">
                                                                                <div className="flex-1 min-w-0">
                                                                                    <div className="flex items-center gap-2">
                                                                                        <span className="text-base">{p.icon}</span>
                                                                                        <span className="font-bold text-gray-800 text-xs">{p.title}</span>
                                                                                    </div>
                                                                                    <div className="text-[10px] text-gray-500 truncate mt-0.5 pl-6">{p.desc}</div>
                                                                                    <a href={p.link} target="_blank" className="text-[10px] text-indigo-400 hover:underline pl-6 block">{p.link}</a>
                                                                                </div>
                                                                            </div>
                                                                        </td>
                                                                        <td className="p-2 text-center space-x-1 align-top pt-2">
                                                                            {p.docId ? (
                                                                                <>
                                                                                    <button onClick={() => startEdit(p)} className="text-gray-400 hover:text-indigo-600"><i className="ph-bold ph-pencil-simple text-sm"></i></button>
                                                                                    <button onClick={() => handleDelete(p.docId)} className="text-gray-400 hover:text-red-600"><i className="ph-bold ph-trash text-sm"></i></button>
                                                                                </>
                                                                            ) : (
                                                                                <span className="text-[9px] text-gray-300 bg-gray-100 px-1 rounded">Demo</span>
                                                                            )}
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}

                                            {adminTab === 'form' && (
                                                <div className="max-w-md mx-auto">
                                                    <h3 className="font-bold text-sm mb-4 border-b pb-1">
                                                        {editTarget ? "프로젝트 수정" : "새 프로젝트 추가"}
                                                    </h3>
                                                    <div className="space-y-3">
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-gray-500 mb-1">제목</label>
                                                            <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none" 
                                                                value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} placeholder="예: 급식표 앱" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-gray-500 mb-1">설명</label>
                                                            <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none" 
                                                                value={formData.desc} onChange={e => setFormData({...formData, desc: e.target.value})} placeholder="설명" />
                                                        </div>
                                                        <div className="flex gap-3">
                                                            <div className="flex-1">
                                                                <label className="block text-[10px] font-bold text-gray-500 mb-1">아이콘</label>
                                                                <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none text-center" 
                                                                    value={formData.icon} onChange={e => setFormData({...formData, icon: e.target.value})} placeholder="🍱" />
                                                            </div>
                                                            <div className="flex-[2]">
                                                                <label className="block text-[10px] font-bold text-gray-500 mb-1">색상 (Tailwind)</label>
                                                                <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none" 
                                                                    value={formData.color} onChange={e => setFormData({...formData, color: e.target.value})} placeholder="bg-blue-100 text-blue-600" />
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-gray-500 mb-1">링크</label>
                                                            <input type="text" className="w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none" 
                                                                value={formData.link} onChange={e => setFormData({...formData, link: e.target.value})} placeholder="./Lv4_S02_Lunch.html" />
                                                        </div>
                                                        <div className="pt-2 flex gap-2">
                                                            <button onClick={() => setAdminTab("list")} className="flex-1 bg-gray-200 text-gray-700 py-2 rounded text-xs font-bold hover:bg-gray-300">취소</button>
                                                            <button onClick={handleFormSubmit} className="flex-[2] bg-indigo-600 text-white py-2 rounded text-xs font-bold hover:bg-indigo-700 shadow">
                                                                {editTarget ? "수정 완료" : "추가하기"}
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {adminTab === 'csv' && (
                                                <div className="max-w-md mx-auto text-center pt-4">
                                                    <div className="bg-green-50 border-2 border-dashed border-green-300 rounded-lg p-6 mb-4">
                                                        <i className="ph-duotone ph-file-csv text-4xl text-green-500 mb-2"></i>
                                                        <h3 className="text-sm font-bold text-green-800 mb-1">CSV 일괄 업로드</h3>
                                                        <p className="text-[10px] text-gray-600 mb-4">
                                                            형식: 제목,설명,아이콘,색상,링크
                                                        </p>
                                                        <input 
                                                            type="file" 
                                                            accept=".csv"
                                                            ref={fileInputRef}
                                                            onChange={handleCsvUpload}
                                                            className="block w-full text-[10px] text-gray-500
                                                                file:mr-2 file:py-1 file:px-3
                                                                file:rounded-full file:border-0
                                                                file:text-[10px] file:font-semibold
                                                                file:bg-green-100 file:text-green-700
                                                                hover:file:bg-green-200 cursor-pointer mx-auto max-w-xs
                                                            "
                                                        />
                                                    </div>
                                                    {uploadStatus && (
                                                        <div className="bg-indigo-50 text-indigo-700 p-2 rounded text-xs font-bold animate-pulse">
                                                            {uploadStatus}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
